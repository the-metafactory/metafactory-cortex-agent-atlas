# arc-manifest.yaml — metafactory-cortex-agent-atlas
#
# CHASSIS SLICE (W1b of the-metafactory/vision#9 epic). This is the
# installable shape ONLY — no brain logic, no effects, no Discord/gh code.
# Pattern copied from metafactory-cortex-agent-escort @ v0.5.0 (the canonical
# sample of a cortex agent bundle with a closed effect universe); Atlas
# reuses its manifest idiom verbatim where the shape carries over.
#
# `arc install metafactory-cortex-agent-atlas` drops the agent fragment +
# persona into the cortex host's agents.d/ + personas/ dirs, then runs the
# lifecycle postinstall scripts below.
# See: https://github.com/the-metafactory/arc

schema: arc/v1
name: "metafactory-cortex-agent-atlas"
version: "0.1.0"
type: agent
tier: community
license: "MIT"
description: "Atlas — the Factory's product-manager agent (plan steward). Cortex agent bundle: ADD/REMOVE intake with a principal RATIFY gate, map+ledger atomic updates, self-healing reconcile, doc changes by PR only. Spec: the-metafactory/vision#9"
authors:
  - "the-metafactory"
repository: "the-metafactory/metafactory-cortex-agent-atlas"

targets:
  - cortex

# Brain secrets: no API key, no token, no credential of its own — the hybrid
# voice runs through the STACK'S substrate auth (agent.yaml
# runtime.brain.secrets: []). See CONSTITUTION in persona.md — Atlas never
# merges and never self-ratifies, so this pack carries no gh write credential
# either; it uses whatever `gh` the host is already authenticated as.
#
# It does, however, READ eleven environment variables — eight of them
# load-bearing, three of them gating constitution rule 3. They are declared in
# `capabilities.secrets` below and in agent.yaml's `plan:`, `gate:` and
# `watch:` blocks, with an operator table in README.md § Configuration.
#
# NOTE, because the text here previously said otherwise: only the DISCORD
# PRESENCE identifiers are resolved by cortex at config-load. cortex's
# `__ENV__` resolution is scoped to surface fields
# (src/common/config/resolve-env-placeholders.ts — ENV_PLACEHOLDER_PATTERN +
# DISCORD_ID_FIELDS). The plan/gate/watch placeholders are this pack's
# declaration convention; the brain reads those names from its OWN process
# env, and cortex spawns a brain with a MINIMAL env (PATH/HOME/LANG/TMPDIR +
# `runtime.brain.secrets` only — src/brain/exec-brain-runner.ts `buildEnv`).
# Declaring the contract is this slice; wiring it through
# `runtime.brain.secrets` belongs with the daemon entrypoint (epic #5).

# Capability surface — rendered by `arc install` / `arc info`, so an operator
# sees what the bundle needs BEFORE consenting. Declared honestly: every
# subprocess and host below is one this pack's code actually reaches.
capabilities:
  filesystem:
    read:
      # Instance state (state.sqlite + events). Override: ATLAS_STATE_DIR.
      - "~/.config/cortex/agents/atlas"
      # The agent-state bundle — the dashboard-regen script only.
      # Override: ATLAS_AGENT_STATE_DIR.
      - "~/.config/metafactory/pkg/repos/agent-state"
      # The plan working checkout, when ATLAS_PLAN_CHECKOUT is set. Unset ⇒
      # never touched, and doc-change PRs are disabled.
      - "$ATLAS_PLAN_CHECKOUT"
    write:
      - "~/.config/cortex/agents/atlas"
      - "$ATLAS_PLAN_CHECKOUT"
  network:
    - host: api.github.com
      reason: "gh reads the plan body and the state of issues the plan links to, and writes the ratified plan edit, the ledger receipt comment, and the doc-change PR"
    - host: github.com
      reason: "git push of the doc-change branch from ATLAS_PLAN_CHECKOUT — never to the base branch, and the gh adapter has no merge verb"
  bash:
    allowed: true
    # Not a shell: every invocation is an argv array to Bun.spawn, and the
    # write path is prefix-allow-listed in brain/effects/gh.ts. Listed here at
    # the granularity that allow-list actually enforces.
    restricted_to:
      - "gh api"            # read-only; GET-shaped, -X/--method refused (brain/gh.ts)
      - "gh issue view"
      - "gh issue comment"
      - "gh issue edit"
      - "gh pr create"      # there is deliberately NO `gh pr merge`
      - "git push"
      - "bun <agent-state>/skill/scripts/dashboard.ts regen"
  # Environment variables the brain reads. Not credentials — ids, coordinates
  # and cadence — but arc's `secrets` list is the installer-visible env
  # declaration surface ("env vars or secret keys the package reads"), and
  # these appearing NOWHERE an installer or operator can see them is precisely
  # the defect this block closes.
  secrets:
    # REQUIRED — the ratification gate. Any one missing ⇒ gate NOT ARMED, and
    # every RATIFY/DECLINE is ignored with stderr as the only signal.
    - ATLAS_RATIFIER_PRINCIPAL
    - ATLAS_RATIFIER_PLATFORM_IDS
    - ATLAS_SELF_PLATFORM_IDS      # constitution rule 3's subject; a STALE value weakens it silently
    # REQUIRED — the effect universe. Any one missing/malformed ⇒ no plan
    # edit, no ledger post, no PR.
    - ATLAS_PLAN_REPO
    - ATLAS_PLAN_ISSUE
    - ATLAS_CHANNEL_ID
    # OPTIONAL — defaulted.
    - ATLAS_PLAN_BASE_BRANCH       # default `main`; malformed refuses the WHOLE effect config
    - ATLAS_PLAN_CHECKOUT          # unset ⇒ doc-change PRs disabled (fail closed)
    - ATLAS_WATCH_INTERVAL_MS      # default 900000 ms, clamped to [60000, 86400000]
    - ATLAS_STATE_DIR              # default ~/.config/cortex/agents/atlas
    - ATLAS_AGENT_STATE_DIR        # default ~/.config/metafactory/pkg/repos/agent-state

# Instance state (OPTIONAL) — the memory module.
#
# Declaring this block opts Atlas into the metafactory memory module: the
# agent-state bundle (github.com/the-metafactory/agent-state) scaffolds a
# per-instance home at ~/.config/cortex/agents/atlas/ with a work queue
# (work_items), an append-only diary (events), a dashboard, and weekly
# retros. Declared from day one (not deferred) so `owns.state` below has a
# real tree to name and `arc purge` is clean from the first install — see
# cortex#2338 for the parallel purge-declaration effort on cortex itself.
# Fail-soft: without the bundle or instance dir Atlas runs memory-only.
# Field shape per forge/design/agent-platform.md §state.
state:
  blueprint: agent-state
  version: ">=0.1.0"

lifecycle:
  postinstall:
    # Step 1 — the running cortex daemon learns the freshly dropped fragment.
    - scripts/signal-cortex-reload.sh
    # NO issue-nats-creds.sh step, deliberately: Atlas is an IN-PROCESS
    # agent (agent.yaml runtime.mode: in-process) — it rides the stack's
    # single signing identity and is not bus-sovereign, so there is no
    # per-agent NATS credential to mint. Same posture as escort.
    # Step 2 — scaffold the optional instance state (soft-skips if the
    # agent-state bundle isn't installed; Atlas runs stateless without it).
    - scripts/scaffold-state.sh

# depends_on.packages — the arc AUTO-INSTALL contract (cortex#2028): arc
# clones + installs each {name, repo} on `arc install atlas`. cortex is
# declared here WITH a `repo:` field (luna-stack arc-manifest.yaml shape)
# so a bare `arc install metafactory-cortex-agent-atlas` on a host with no
# cortex yet still resolves the host it installs into.
depends_on:
  packages:
    - name: cortex
      repo: "https://github.com/the-metafactory/cortex"

# owns — the purge-scope declaration (arc#359 / arc#360), declared from day
# one so `arc purge metafactory-cortex-agent-atlas` is clean the first time
# it is ever run, not retrofitted later. `state` (not `userData`): the
# agent-state instance dir is RUNTIME-GENERATED (state.sqlite, dashboard.md,
# events) — apt /var, not apt /home — so a purge is expected to reclaim it.
# Scoped to exactly Atlas's own instance dir under the cortex agents/
# convention; no shared tree (e.g. ~/.config/cortex/agents.d/ itself, which
# holds every installed agent's fragment) is named here.
owns:
  state:
    - "~/.config/cortex/agents/atlas"
